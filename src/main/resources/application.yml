spring:
  application:
    name: secure_file_explorer_backend
  servlet:
    multipart:
      enabled: true
      max-file-size: 10GB
      max-request-size: 10GB

external-download:
  max-size-mb: 500
  max-concurrent: 3
  connect-timeout-seconds: 10
  read-timeout-seconds: 60

explorer:
  root-path: ./workdir
  max-download-size: 52428800 # 50 MB
  
logging:
  level:
    '[org.springframework.web]': DEBUG
    '[org.springframework.web.multipart]': DEBUG
    '[org.springdoc]': DEBUG
    '[io.swagger.v3]': DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    url: /openapi.yaml
